spring.application.name=admission
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/admission
spring.datasource.username=root
spring.datasource.password=nitr@123

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# "update" creates any missing tables (users, employees, candidate_profile, states) and never drops data.
# candidate_exp already exists in your DB and is left as is.
spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- app settings ----
app.cors.allowed-origins=http://localhost:4200
app.upload-dir=uploads
# JWT secret must be at least 32 characters. Override with env var JWT_SECRET in production.
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-1234567890}
app.jwt.expiration-ms=28800000
# first admin user, created on startup only when the users table is empty
app.admin.username=admin
app.admin.password=admin123
app.admin.full-name=Administrator
app.admin.email=admin@example.com
