<div class="login">
  <section class="intro" aria-hidden="true">
    <div class="intro-inner">
      <span class="mark">
        <svg viewBox="0 0 32 32" width="26" height="26"><path d="M9 9v8a7 7 0 0 0 14 0V9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
      </span>
      <h1>UMS</h1>
      <p> </p>
    </div>
  </section>

  <section class="panel">
    <form class="box" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <h2>Sign in</h2>
      <p class="sub">Use your UMS account to continue.</p>

      @if (error()) { <div class="alert alert-error" role="alert">{{ error() }}</div> }

      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" formControlName="username" autocomplete="username" autofocus />
        @if (invalid('username')) { <span class="error">Enter your username.</span> }
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="pw">
          <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" />
          <button type="button" class="toggle" (click)="showPassword.set(!showPassword())" [attr.aria-pressed]="showPassword()">
            {{ showPassword() ? 'Hide' : 'Show' }}
          </button>
        </div>
        @if (invalid('password')) { <span class="error">Enter your password.</span> }
      </div>

      <button type="submit" class="btn btn-primary btn-block go" [disabled]="loading()">
        @if (loading()) { <span class="spinner"></span> }
        {{ loading() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </section>
</div>
